# fly.toml app configuration file generated for vpython-prompt-challenge on 2026-03-04T18:04:56+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vpython-prompt-challenge'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 4009
  force_https = true
  # 요청 시 기동(2026-09-03 전환). 유휴 시 정지되고 첫 접속에 5~10초 지연이 생긴다.
  # 수업 시작에 학생이 동시에 몰려 콜드 스타트가 문제되면
  # auto_stop_machines = 'off' / min_machines_running = 1 로 되돌릴 것.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # 헬스체크가 없으면 재시작 직후 Node가 뜨기 전에 프록시가 요청을 넘겨
  # 학생 화면이 몇 초간 502를 받는다. /api/health 는 DB 응답까지 확인한다.
  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[mounts]
  source = 'vpython_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
